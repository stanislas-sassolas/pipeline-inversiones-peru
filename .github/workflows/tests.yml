# Lance les tests à chaque envoi sur GitHub. Les tests n'ont besoin ni d'Internet ni des données du MEF :
# ils travaillent sur de petits tableaux inventés.
name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
